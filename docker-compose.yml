name: game-hub

services:
  # ============================================================================
  # 1. Game-Hub 微内核与业务网关服务
  # ============================================================================
  gamehub:
    build:
      context: .
      dockerfile: Dockerfile
    image: game-hub:latest
    container_name: gamehub-service
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      GAMEHUB_HOST: 0.0.0.0
      GAMEHUB_PORT: 8080
      GAMEHUB_PATH: /onebot/v11/ws
      NAPCAT_TO_GAMEHUB_CONNECTION_TOKEN: ${NAPCAT_TO_GAMEHUB_CONNECTION_TOKEN:-gamehub_secret_token_2026}
      GAMEHUB_ADMIN_REGISTRATION_TOKEN: ${GAMEHUB_ADMIN_REGISTRATION_TOKEN:-}
      GAMEHUB_ADMIN_USERS: ${GAMEHUB_ADMIN_USERS:-}
      TELEGRAM_BOT_API_TOKEN: ${TELEGRAM_BOT_API_TOKEN:-}
      TELEGRAM_BOT_API_HTTPS_PROXY_URL: ${TELEGRAM_BOT_API_HTTPS_PROXY_URL:-}
      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL:-https://api.telegram.org}
      CHATAI_KEY_MAIN: ${CHATAI_KEY_MAIN:-}
      CHATAI_ADMIN_REGISTRATION_TOKEN: ${CHATAI_ADMIN_REGISTRATION_TOKEN:-}
      GAMEHUB_DB: /app/data/vault.db
    volumes:
      # 持久化统一身份保密库 (vault.db)，优先写入全局 DATA_ROOT，支持相对路径回退
      - ${DATA_ROOT:-./data}/game-hub/data:/app/data
    networks:
      - gamehub-net
    # 安全基线：8080 端口不映射至宿主机，仅在内部专用网桥 gamehub-net 互通

  # ============================================================================
  # 2. NapCat QQ NT 协议客户端容器 (官方镜像)
  # ============================================================================
  napcat:
    profiles: ["napcat"]
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-service
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # 从部署用私有 .env 的 QQ_ACCOUNT 读取快速登录账号，不在 Compose 中填写真实值
      ACCOUNT: ${QQ_ACCOUNT:-}
      WS_ENABLE: "true"
      NAPCAT_GID: ${PGID:-1000}
      NAPCAT_UID: ${PUID:-1000}
    ports:
      - "${NAPCAT_WEBUI_PORT:-6099}:6099" # 宿主机 WebUI 面板端口，用于扫码登录
    volumes:
      # 配置目录与数据目录严格分离：配置归入 CONFIG_ROOT，会话与凭据归入 DATA_ROOT
      - ${CONFIG_ROOT:-./config}/napcat:/app/napcat/config
      - ${DATA_ROOT:-./data}/napcat/data:/app/napcat/data
      - ${DATA_ROOT:-./data}/napcat/QQ:/app/.config/QQ
    networks:
      - gamehub-net
    depends_on:
      - gamehub

networks:
  gamehub-net:
    driver: bridge
